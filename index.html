<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Immi Taller · Pao Navedo</title>
  <meta name="description" content="Cuadros pintados a mano en acrílico, óleo y acuarela." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>
<!-- Form de Netlify (oculto, solo para que Netlify lo detecte) -->
<form name="pedido-immi" netlify netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="pedido-immi" />
  <input type="text" name="cliente_nombre" />
  <input type="email" name="cliente_email" />
  <input type="text" name="cliente_telefono" />
  <input type="text" name="numero_pedido" />
  <input type="text" name="cuadro" />
  <input type="text" name="tamanio" />
  <input type="text" name="precio" />
  <input type="text" name="zona" />
  <input type="text" name="metodo_pago" />
  <input type="text" name="tipo_pedido" />
  <textarea name="descripcion"></textarea>
  <input type="text" name="imagen_ref" />
  <input type="text" name="bot-field" />
</form>
<script src="app.js"></script>
</body>
</html>
